# Builder for the OSW-809 Gadgetbridge test APK.
# Base: Codeberg upstream Freeyourgadget/Gadgetbridge @ c75887df30fc899aebe878919e28a8a1b0132b55
# Patch: osw809.patch (sha256 585365f9f8df2954ff3975354942903a5c7fe7c287be6a6688be9276c81b46ee) - verified in-job.
name: build-osw809
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout this repo (patch + workflow only)
        uses: actions/checkout@v4
      - name: clone upstream Gadgetbridge from Codeberg at pinned commit
        run: |
          git clone https://codeberg.org/Freeyourgadget/Gadgetbridge.git src
          cd src
          git checkout c75887df30fc899aebe878919e28a8a1b0132b55
          echo "UPSTREAM_BASE=$(git log -1 --format=%H)" >> "$GITHUB_ENV"
          git log -1 --format="pinned base: %H %cd"
      - name: verify + apply patch v2
        run: |
          cd src
          cp ../osw809.patch .
          echo "585365f9f8df2954ff3975354942903a5c7fe7c287be6a6688be9276c81b46ee  osw809.patch" | sha256sum -c -
          git apply --check osw809.patch
          git apply osw809.patch
          git status --short
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: build debug APK (mainline flavour)
        run: |
          cd src
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :app:assembleMainlineDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gadgetbridge-osw809
          path: src/app/build/outputs/apk/mainline/debug/*.apk
